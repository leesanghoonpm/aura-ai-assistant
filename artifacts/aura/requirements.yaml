packages:
  "framer-motion": "For buttery smooth, premium UI animations and page transitions."
  "date-fns": "For human-readable date formatting across the app."
  "clsx": "Utility for constructing className strings conditionally."
  "tailwind-merge": "Utility for merging Tailwind CSS classes safely."
  "react-hook-form": "For performant, flexible, and extensible forms."
  "@hookform/resolvers": "Zod resolver for form validation."
  "zod": "Schema validation for forms."

images:
  - path: "artifacts/aura/public/images/aura-glow.png"
    description: "A very subtle, minimal, abstract soft glow in pristine white and light silver, feeling like a gentle breath of air. Ultra minimal, clean, Toss app style background."
    aspect_ratio: "16:9"
  - path: "artifacts/aura/public/images/avatar-default.png"
    description: "A minimal, flat, elegant abstract geometric avatar icon for a user profile. Clean, modern, simple."
    aspect_ratio: "1:1"

notes:
  - Uses the @workspace/api-client-react for all API interactions.
  - Implements the Shadcn Sidebar as requested.
  - Follows a strict 'Toss' style monochrome and ultra-clean aesthetic.
